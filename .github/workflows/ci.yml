name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_BASE_URL: https://worlddiscoverydata.com/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Check internal links
        run: npm run check:links
      - name: Run tests
        run: npm test
      - name: Rebuild site after tests
        run: npm run build
      - name: Recheck internal links
        run: npm run check:links
