name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build release artifact
        run: npm run check
      - name: Stamp release identity
        run: printf '%s\n' "$GITHUB_SHA" > site/release-sha.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://worlddiscoverydata.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies for browser verification
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact deployed commit with retry/backoff
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            live_sha="$(curl -L --silent --show-error --fail --max-time 20 "${BASE_URL}/release-sha.txt?release=${GITHUB_SHA}" || true)"
            if [ "$live_sha" = "$GITHUB_SHA" ]; then echo "LIVE COMMIT VERIFIED: $live_sha"; exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Verify live release contracts
        run: node scripts/verify-live-release.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live browser smoke
        run: npx playwright test test/live-mobile-smoke.spec.js test/internet-use-country-live.spec.js test/internet-use-regions-live.spec.js --reporter=line
      - name: Upload browser-smoke evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-smoke-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
