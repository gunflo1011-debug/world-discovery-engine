name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Refresh WDI catalog']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A refresh workflow commits generated data with GITHUB_TOKEN. GitHub
          # intentionally does not emit a second push-triggered workflow from
          # that token, so workflow_run must deploy the current main HEAD.
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build release artifact
        run: npm run check
      - id: release
        name: Stamp release identity
        shell: bash
        run: |
          release_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$release_sha" > site/release-sha.txt
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://worlddiscoverydata.com
      RELEASE_SHA: ${{ needs.deploy.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies for browser verification
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact deployed commit with retry/backoff
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            live_sha="$(curl -L --silent --show-error --fail --max-time 20 "${BASE_URL}/release-sha.txt?release=${RELEASE_SHA}" || true)"
            if [ "$live_sha" = "$RELEASE_SHA" ]; then echo "LIVE COMMIT VERIFIED: $live_sha"; exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Verify live release contracts
        run: node scripts/verify-live-release.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live browser smoke
        run: npx playwright test test/live-mobile-smoke.spec.js test/internet-use-country-live.spec.js test/internet-use-regions-live.spec.js --reporter=line
      - name: Upload browser-smoke evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-smoke-${{ needs.deploy.outputs.release_sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
