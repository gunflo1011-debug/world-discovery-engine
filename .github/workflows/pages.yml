name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build release artifact
        run: npm run check
      - name: Stamp release identity
        run: printf '%s\n' "$GITHUB_SHA" > site/release-sha.txt
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://gunflo1011-debug.github.io/world-discovery-engine
    steps:
      - name: Verify exact deployed commit with retry/backoff
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            live_sha="$(curl -L --silent --show-error --fail --max-time 20 "${BASE_URL}/release-sha.txt" || true)"
            if [ "$live_sha" = "$GITHUB_SHA" ]; then
              echo "LIVE COMMIT VERIFIED: $live_sha (attempt ${attempt})"
              exit 0
            fi
            echo "Retry ${attempt}: expected $GITHUB_SHA, got ${live_sha:-network-error-or-empty}"
            sleep $((attempt * 10))
          done
          echo "LIVE FAILED: deployed commit identity did not converge to $GITHUB_SHA"
          exit 1
      - name: Verify critical live routes with retry/backoff
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "/index.html"
            "/indicators/"
            "/indicators/real-gdp/"
            "/indicators/real-gdp/status.json"
            "/evidence/"
            "/evidence/index.json"
            "/evidence/germany-population-revision-2025/"
            "/evidence/germany-population-revision-2025/evidence.json"
            "/evidence/germany-population-revision-2025/evidence.csv"
            "/sitemap.xml"
            "/robots.txt"
          )
          for route in "${routes[@]}"; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -L --silent --show-error --output /tmp/live-body --write-out '%{http_code}' --max-time 20 "${BASE_URL}${route}" || true)"
              if [ "$code" = "200" ] && [ -s /tmp/live-body ]; then
                echo "LIVE OK ${route} (attempt ${attempt})"
                ok=1
                break
              fi
              echo "Retry ${attempt}: ${route} returned ${code:-network-error}"
              sleep $((attempt * 10))
            done
            if [ "$ok" -ne 1 ]; then
              echo "LIVE FAILED ${route}"
              exit 1
            fi
          done
      - name: Verify live machine discovery contract
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 "${BASE_URL}/evidence/index.json" -o /tmp/evidence-index.json
          node - <<'NODE'
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('/tmp/evidence-index.json', 'utf8'));
          if (index.schemaVersion !== '1.2') throw new Error(`Expected evidence index schema 1.2, got ${index.schemaVersion}`);
          const records = index.records || index.items || index.evidence || [];
          if (!Array.isArray(records) || records.length === 0) throw new Error('Evidence index has no records');
          const germany = records.find((record) =>
            record?.status === 'REAL' &&
            record?.discoveryReady === true &&
            (record?.indicator?.code === 'SP.POP.TOTL' || record?.indicatorCode === 'SP.POP.TOTL') &&
            (record?.entity?.code === 'DEU' || record?.entityCode === 'DEU')
          );
          if (!germany) throw new Error('Missing discovery-ready REAL Germany population record');
          const jsonPath = germany?.distributions?.json || germany?.json || germany?.jsonPath || germany?.evidenceJson;
          const csvPath = germany?.distributions?.csv || germany?.csv || germany?.csvPath || germany?.evidenceCsv;
          if (!jsonPath || !csvPath) throw new Error('Germany record does not advertise JSON and CSV distributions');
          fs.writeFileSync('/tmp/machine-paths.txt', `${jsonPath}\n${csvPath}\n`);
          NODE
          while IFS= read -r path; do
            case "$path" in
              http://*|https://*) url="$path" ;;
              /*) url="${BASE_URL}${path}" ;;
              *) url="${BASE_URL}/${path}" ;;
            esac
            curl -L --fail --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 "$url" -o /tmp/machine-body
            test -s /tmp/machine-body
            echo "MACHINE DISCOVERY OK $url"
          done < /tmp/machine-paths.txt
      - name: Verify discovery metadata on live homepage
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 "${BASE_URL}/index.html" -o /tmp/index.html
          grep -qi 'rel="canonical"' /tmp/index.html
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 "${BASE_URL}/robots.txt" -o /tmp/robots.txt
          grep -qi 'sitemap:' /tmp/robots.txt
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 "${BASE_URL}/sitemap.xml" -o /tmp/sitemap.xml
          grep -q '/world-discovery-engine/' /tmp/sitemap.xml
