name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test and build release artifact
        run: npm run check
      - name: Stamp release identity
        run: printf '%s\n' "$GITHUB_SHA" > site/release-sha.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://worlddiscoverydata.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies for browser verification
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify exact deployed commit with retry/backoff
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            live_sha="$(curl -L --silent --show-error --fail --max-time 20 "${BASE_URL}/release-sha.txt" || true)"
            if [ "$live_sha" = "$GITHUB_SHA" ]; then echo "LIVE COMMIT VERIFIED: $live_sha"; exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
      - name: Verify live release contracts
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" node - <<'NODE'
          const base = process.env.BASE_URL.replace(/\/$/, '');
          const wait = ms => new Promise(r => setTimeout(r, ms));
          async function get(path, type='text') {
            const url = path.startsWith('http') ? path : `${base}${path}`;
            let last;
            for (let i=0;i<5;i++) {
              try {
                const r = await fetch(url, {redirect:'follow'});
                if (!r.ok) throw new Error(`${r.status} ${url}`);
                const text = await r.text();
                if (!text) throw new Error(`empty ${url}`);
                return type === 'json' ? JSON.parse(text) : text;
              } catch (e) { last=e; await wait((i+1)*5000); }
            }
            throw last;
          }
          function csv(line) {
            const out=[]; let cur=''; let q=false;
            for(let i=0;i<line.length;i++){const c=line[i]; if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(c===','&&!q){out.push(cur.trim());cur='';}else cur+=c;} out.push(cur.trim()); return out;
          }
          const critical=['/index.html','/indicators/','/indicators/real-gdp/','/indicators/real-gdp/status.json','/indicators/internet-use/','/indicators/internet-use/data.json','/indicators/internet-use/data.csv','/indicators/internet-use/country/index.json','/indicators/internet-use/country/deu/','/indicators/internet-use/country/deu/data.json','/indicators/internet-use/country/deu/data.csv','/indicators/internet-use/region/index.json','/build.json','/evidence/','/evidence/index.json','/sitemap.xml','/robots.txt'];
          for(const p of critical) await get(p);

          const home=await get('/index.html');
          if(!/rel="canonical"/i.test(home)) throw new Error('home canonical missing');
          const robots=await get('/robots.txt');
          if(!robots.includes(`Sitemap: ${base}/sitemap.xml`)) throw new Error('robots sitemap mismatch');
          const sitemap=await get('/sitemap.xml');
          if(!sitemap.includes(`${base}/evidence/germany-population-revision-2025/`)) throw new Error('Germany REAL evidence missing from sitemap');

          const gdp=await get('/indicators/real-gdp/status.json','json');
          if(gdp?.indicator?.code!=='NY.GDP.MKTP.KD'||gdp?.screeningStatus!=='BLOCKED_METHODOLOGY_COMPARABILITY'||gdp?.publishableRevisionData!==false) throw new Error('GDP fail-closed contract violated');

          const source=await get('/indicators/internet-use/data.json','json');
          const index=await get('/indicators/internet-use/country/index.json','json');
          const build=await get('/build.json','json');
          if(index.schemaVersion!=='1.2'||index.status!=='CURRENT_VERIFIED'||index.indicator!=='IT.NET.USER.ZS'||index.observationYear!==2024) throw new Error('Internet-use country index 1.2 contract mismatch');
          if(!index.provenance?.publisher||!index.provenance?.metadataUrl||!index.provenance?.retrievalUrl||!index.provenance?.license) throw new Error('Internet-use provenance incomplete');
          if(!Array.isArray(source.records)||!Array.isArray(index.countries)||index.countries.length!==source.records.length) throw new Error('Internet-use country count mismatch');
          if(build.internetUseCountryProfiles!==index.countries.length) throw new Error('build.json country count mismatch');
          const parent=await get('/indicators/internet-use/');
          if(parent.includes('id="country-profiles"')) throw new Error('duplicate country-card directory returned to parent page');
          if(Buffer.byteLength(parent,'utf8')>=125000) throw new Error('internet-use parent exceeds HTML performance budget');
          const jsonLd=[...parent.matchAll(/<script type="application\/ld\+json">(.*?)<\/script>/gs)].map(m=>JSON.parse(m[1]));
          const itemList=jsonLd.find(x=>x['@type']==='ItemList');
          if(!itemList||itemList.numberOfItems!==index.countries.length||itemList.itemListElement?.length!==index.countries.length) throw new Error('country ItemList mismatch');
          const listed=new Set(itemList.itemListElement.map(x=>x.url));
          const seen=new Set();
          for(const country of index.countries){
            if(!/^[A-Z]{3}$/.test(country.code)||!country.url||!country.machineDataUrl||!country.machineCsvUrl) throw new Error(`malformed country ${country.code||'unknown'}`);
            if(seen.has(country.code)) throw new Error(`duplicate country ${country.code}`); seen.add(country.code);
            const parentHref=`href="./country/${country.code.toLowerCase()}/"`;
            if(parent.split(parentHref).length-1!==2) throw new Error(`parent discovery count mismatch ${country.code}`);
            const human=`${base}${country.url}`;
            if((sitemap.split(human).length-1)!==1) throw new Error(`sitemap count mismatch ${country.code}`);
            if(!listed.has(human)) throw new Error(`ItemList missing ${country.code}`);
            const html=await get(country.url);
            const payload=await get(country.machineDataUrl,'json');
            const csvText=await get(country.machineCsvUrl);
            if(payload.schemaVersion!=='1.1'||payload.status!=='CURRENT_VERIFIED'||payload.indicator?.code!==index.indicator||payload.entity?.code!==country.code||payload.observation?.year!==2024||payload.observation?.value!==country.value||payload.entity?.region?.code!==country.region?.code||payload.entity?.region?.name!==country.region?.name) throw new Error(`country JSON identity mismatch ${country.code}`);
            if(payload.scope?.completeGlobalRanking!==false||payload.scope?.historicalRevisionProduct!==false||payload.humanUrl!==human) throw new Error(`country JSON scope mismatch ${country.code}`);
            if(!html.includes('./data.json')||!html.includes('./data.csv')) throw new Error(`country machine links missing ${country.code}`);
            const lines=csvText.trim().split(/\r?\n/).map(csv); const cols=lines[0]; const row=lines[1];
            for(const k of ['entity_code','indicator_code','reference_year','value']) if(!cols.includes(k)) throw new Error(`country CSV missing ${k}: ${country.code}`);
            const v=k=>row[cols.indexOf(k)];
            if(v('entity_code')!==country.code||v('indicator_code')!==index.indicator||Number(v('reference_year'))!==2024||Number(v('value'))!==Number(country.value)) throw new Error(`country CSV identity mismatch ${country.code}`);
          }

          const regionIndex=await get('/indicators/internet-use/region/index.json','json');
          if(regionIndex.schemaVersion!=='1.0'||regionIndex.status!=='CURRENT_VERIFIED'||regionIndex.indicator!==index.indicator||regionIndex.observationYear!==2024||!Array.isArray(regionIndex.regions)||regionIndex.regions.length!==7) throw new Error('Internet-use region index contract mismatch');
          if(build.internetUseRegionalPages!==7) throw new Error('build.json regional page count mismatch');
          const indexedRegionCodes=new Set(index.countries.map(country=>country.region?.code));
          const regionCodes=new Set();
          let regionCountryTotal=0;
          for(const region of regionIndex.regions){
            if(!/^[A-Z]{3}$/.test(region.code)||!region.name||!region.url||!region.machineDataUrl||regionCodes.has(region.code)) throw new Error(`malformed region ${region.code||'unknown'}`);
            regionCodes.add(region.code);
            regionCountryTotal+=region.countries;
            if(!indexedRegionCodes.has(region.code)) throw new Error(`region has no indexed countries ${region.code}`);
            const human=`${base}${region.url}`;
            if((sitemap.split(human).length-1)!==1) throw new Error(`region sitemap count mismatch ${region.code}`);
            const html=await get(region.url);
            const payload=await get(region.machineDataUrl,'json');
            if(payload.schemaVersion!=='1.0'||payload.status!=='CURRENT_VERIFIED'||payload.indicator?.code!==index.indicator||payload.observationYear!==2024||payload.region?.code!==region.code||payload.region?.name!==region.name||payload.records?.length!==region.countries) throw new Error(`region JSON identity mismatch ${region.code}`);
            if(!html.includes('./data.json')||!html.includes('Regional picture')||!html.includes('How to use this comparison')) throw new Error(`region page contract mismatch ${region.code}`);
            for(const record of payload.records){
              const country=index.countries.find(candidate=>candidate.code===record.code);
              if(!country||country.region?.code!==region.code||record.year!==2024||record.value!==country.value||!html.includes(`../../country/${record.code.toLowerCase()}/`)) throw new Error(`region-country mismatch ${region.code}/${record.code}`);
            }
          }
          if(regionCodes.size!==indexedRegionCodes.size||regionCountryTotal!==index.countries.length) throw new Error('regional coverage mismatch');

          const evidence=await get('/evidence/index.json','json');
          if(evidence.schemaVersion!=='1.2'||!Array.isArray(evidence.evidence)||!evidence.evidence.length) throw new Error('evidence index mismatch');
          let germany=false;
          for(const record of evidence.evidence){
            if(record.status!=='REAL'||record.discoveryReady!==true||!record.machineReadable?.json||!record.machineReadable?.csv) throw new Error(`non-ready evidence ${record.slug}`);
            const payload=await get(record.machineReadable.json,'json'); const csvText=await get(record.machineReadable.csv);
            if(payload.status!=='REAL'||payload.indicator?.code!==record.indicator?.code||payload.entity?.code!==record.entity?.code||payload.referenceYear!==record.referenceYear) throw new Error(`evidence JSON identity mismatch ${record.slug}`);
            const lines=csvText.trim().split(/\r?\n/).map(csv); const cols=lines[0];
            const ei=cols.indexOf('entity_code'), ii=cols.indexOf('indicator_code'), yi=cols.indexOf('reference_year');
            if([ei,ii,yi].some(i=>i<0)||!lines.slice(1).some(r=>r[ei]===record.entity?.code&&r[ii]===record.indicator?.code&&String(r[yi])===String(record.referenceYear))) throw new Error(`evidence CSV identity mismatch ${record.slug}`);
            if(record.indicator?.code==='SP.POP.TOTL'&&record.entity?.code==='DEU') germany=true;
          }
          if(!germany) throw new Error('Germany population sentinel missing');
          console.log(`LIVE RELEASE CONTRACT VERIFIED: ${index.countries.length} internet-use countries, ${evidence.evidence.length} REAL evidence records`);
          NODE
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live mobile browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test test/live-mobile-smoke.spec.js test/internet-use-country-live.spec.js --reporter=line
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const base=process.env.BASE_URL.replace(/\/$/,'');
          const regions=['eas','ecs','lcn','mea','nac','sas','ssf'];
          const browser=await chromium.launch({headless:true});
          try {
            for(const width of [360,390,430]){
              for(const slug of regions){
                const page=await browser.newPage({viewport:{width,height:900}});
                const consoleErrors=[]; const pageErrors=[];
                page.on('console',msg=>{if(msg.type()==='error') consoleErrors.push(msg.text());});
                page.on('pageerror',error=>pageErrors.push(String(error)));
                const url=`${base}/indicators/internet-use/region/${slug}/`;
                const response=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
                if(!response?.ok()) throw new Error(`regional HTTP failure ${width}px ${url}`);
                const state=await page.evaluate(()=>({
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  canonical:document.querySelector('link[rel="canonical"]')?.href,
                  navVisible:Boolean(document.querySelector('nav')?.getBoundingClientRect().width),
                  h1:document.querySelector('h1')?.textContent?.trim(),
                  jsonLink:document.querySelector('a[href="./data.json"]')?.getAttribute('href')
                }));
                if(state.overflow>1||state.canonical!==url||!state.navVisible||!state.h1||state.jsonLink!=='./data.json'||consoleErrors.length||pageErrors.length) throw new Error(`regional mobile contract failure ${width}px ${slug}: ${JSON.stringify({state,consoleErrors,pageErrors})}`);
                await page.close();
              }
            }
            for(const width of [360,390,430]){
              const page=await browser.newPage({viewport:{width,height:900}});
              const url=`${base}/indicators/internet-use/?q=Germany&region=ecs&compare=DEU,FRA`;
              const response=await page.goto(url,{waitUntil:'networkidle',timeout:30000});
              if(!response?.ok()) throw new Error(`shareable discovery HTTP failure ${width}px ${url}`);
              const readState=()=>page.evaluate(()=>({
                query:document.querySelector('#country-search')?.value,
                region:document.querySelector('#region-filter')?.value,
                compareA:document.querySelector('#compare-a')?.value,
                compareB:document.querySelector('#compare-b')?.value,
                comparison:document.querySelector('#compare-result')?.textContent?.trim(),
                visibleCodes:[...document.querySelectorAll('#internet-table tbody tr')].filter(row=>!row.hidden).map(row=>row.dataset.code),
                shareHref:document.querySelector('#share-view')?.href,
                canonical:document.querySelector('link[rel="canonical"]')?.href,
                overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
              }));
              const assertState=state=>{
                const shared=new URL(state.shareHref);
                if(state.query!=='Germany'||state.region!=='ecs'||state.compareA!=='DEU'||state.compareB!=='FRA'||state.visibleCodes.length!==1||state.visibleCodes[0]!=='deu'||!state.comparison?.includes('Germany')||!state.comparison?.includes('France')||shared.searchParams.get('q')!=='Germany'||shared.searchParams.get('region')!=='ecs'||shared.searchParams.get('compare')!=='DEU,FRA'||state.canonical!==`${base}/indicators/internet-use/`||state.overflow>1) throw new Error(`shareable discovery contract failure ${width}px: ${JSON.stringify(state)}`);
              };
              assertState(await readState());
              await page.reload({waitUntil:'networkidle'});
              assertState(await readState());
              await page.close();
            }
          } finally { await browser.close(); }
          console.log('REGIONAL MOBILE + SHAREABLE DISCOVERY VERIFIED: 7 regional routes and query restoration at 360/390/430 px');
          NODE
      - name: Upload browser-smoke evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-smoke-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14