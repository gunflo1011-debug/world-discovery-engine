name: Cloudflare analytics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-analytics.yml'
  schedule:
    - cron: '37 6 * * *'

permissions:
  contents: read

jobs:
  cloudflare-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Cloudflare traffic and AI-crawler analytics
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get('CLOUDFLARE_ANALYTICS_TOKEN', '').strip()
          if not token:
              raise SystemExit('Missing CLOUDFLARE_ANALYTICS_TOKEN secret')

          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0)
          start = now - datetime.timedelta(hours=24)
          start_s = start.isoformat().replace('+00:00', 'Z')
          end_s = now.isoformat().replace('+00:00', 'Z')

          ai_agents = [
              'GPTBot',
              'ChatGPT-User',
              'OAI-SearchBot',
              'ClaudeBot',
              'Claude-User',
              'PerplexityBot',
              'Perplexity-User',
              'Google-Extended',
              'Bytespider',
              'meta-externalagent',
              'Applebot-Extended',
          ]
          ai_or = ','.join('{userAgent_like:"%%%s%%"}' % agent for agent in ai_agents)

          query = '''
          query {
            viewer {
              zones {
                zoneTag
                total: httpRequestsAdaptiveGroups(
                  filter: {datetime_geq: "%s", datetime_leq: "%s", requestSource: "eyeball"}
                  limit: 1
                ) { count sum { edgeResponseBytes } }
                topPaths: httpRequestsAdaptiveGroups(
                  filter: {datetime_geq: "%s", datetime_leq: "%s", requestSource: "eyeball"}
                  limit: 20
                  orderBy: [count_DESC]
                ) { count dimensions { clientRequestPath } }
                countries: httpRequestsAdaptiveGroups(
                  filter: {datetime_geq: "%s", datetime_leq: "%s", requestSource: "eyeball"}
                  limit: 20
                  orderBy: [count_DESC]
                ) { count dimensions { clientCountryName } }
                statuses: httpRequestsAdaptiveGroups(
                  filter: {datetime_geq: "%s", datetime_leq: "%s", requestSource: "eyeball"}
                  limit: 20
                  orderBy: [count_DESC]
                ) { count dimensions { edgeResponseStatus } }
                aiCrawlerRequests: httpRequestsAdaptiveGroups(
                  filter: {
                    datetime_geq: "%s"
                    datetime_leq: "%s"
                    requestSource: "eyeball"
                    OR: [%s]
                  }
                  limit: 100
                  orderBy: [count_DESC]
                ) {
                  count
                  dimensions { userAgent clientRequestPath }
                  sum { edgeResponseBytes }
                }
              }
            }
          }
          ''' % (
              start_s, end_s,
              start_s, end_s,
              start_s, end_s,
              start_s, end_s,
              start_s, end_s, ai_or,
          )

          payload = json.dumps({'query': query}).encode('utf-8')
          req = urllib.request.Request(
              'https://api.cloudflare.com/client/v4/graphql',
              data=payload,
              headers={
                  'Authorization': 'Bearer ' + token,
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  result = json.loads(response.read().decode('utf-8'))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode('utf-8', errors='replace')
              raise SystemExit('Cloudflare GraphQL HTTP error %s: %s' % (exc.code, body[:2000]))

          if result.get('errors'):
              raise SystemExit('Cloudflare GraphQL errors: ' + json.dumps(result['errors']))

          zones = result.get('data', {}).get('viewer', {}).get('zones', []) or []
          if not zones:
              raise SystemExit('Token connected, but no zone analytics are visible. Ensure the token is limited to worlddiscoverydata.com with Zone Analytics Read.')
          if len(zones) != 1:
              raise SystemExit('Expected one accessible zone, found %d. Restrict the token to worlddiscoverydata.com.' % len(zones))

          zone = zones[0]
          total_rows = zone.get('total') or []
          total_requests = sum(int(row.get('count', 0)) for row in total_rows)
          total_bytes = sum(int((row.get('sum') or {}).get('edgeResponseBytes', 0)) for row in total_rows)
          ai_rows = zone.get('aiCrawlerRequests') or []
          ai_requests = sum(int(row.get('count', 0)) for row in ai_rows)

          report = {
              'domain': 'worlddiscoverydata.com',
              'generatedAtUtc': end_s,
              'periodStartUtc': start_s,
              'periodEndUtc': end_s,
              'periodHours': 24,
              'note': 'HTTP request analytics. Requests are not the same as human visits/pageviews; Cloudflare Web Analytics/RUM remains the source for real-user visits.',
              'totalHttpRequests': total_requests,
              'totalResponseBytes': total_bytes,
              'recognizedAiCrawlerRequests': ai_requests,
              'recognizedAiCrawlerRows': ai_rows,
              'topPaths': zone.get('topPaths') or [],
              'countries': zone.get('countries') or [],
              'statuses': zone.get('statuses') or [],
          }

          with open('cloudflare-analytics.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, indent=2)

          def line_rows(rows, dimension):
              out = []
              for row in rows[:10]:
                  dims = row.get('dimensions') or {}
                  out.append('- %s: %s requests' % (dims.get(dimension, '(unknown)'), row.get('count', 0)))
              return out or ['- none']

          ai_summary = []
          for row in ai_rows[:20]:
              dims = row.get('dimensions') or {}
              ai_summary.append('- %s | %s | %s requests' % (
                  dims.get('userAgent', '(unknown user agent)'),
                  dims.get('clientRequestPath', '(unknown path)'),
                  row.get('count', 0),
              ))
          if not ai_summary:
              ai_summary = ['- 0 recognized AI-crawler requests in this 24-hour window']

          text = [
              '# Cloudflare daily analytics',
              '',
              'Period: %s to %s (UTC)' % (start_s, end_s),
              '',
              '## Verified totals',
              '- HTTP requests: %d' % total_requests,
              '- Recognized AI-crawler requests: %d' % ai_requests,
              '- Response bytes: %d' % total_bytes,
              '',
              'HTTP requests include assets and automated traffic and must not be interpreted as human visits or clicks.',
              'Cloudflare Web Analytics/RUM is the source for real-user visits/pageviews.',
              '',
              '## Recognized AI crawler activity',
              *ai_summary,
              '',
              '## Top paths by HTTP requests',
              *line_rows(zone.get('topPaths') or [], 'clientRequestPath'),
              '',
              '## Countries by HTTP requests',
              *line_rows(zone.get('countries') or [], 'clientCountryName'),
              '',
              '## HTTP statuses',
              *line_rows(zone.get('statuses') or [], 'edgeResponseStatus'),
              '',
              '## Data limits',
              '- This report uses Cloudflare GraphQL HTTP-request analytics, not RUM visitor counts.',
              '- AI detection here uses known AI crawler user-agent patterns available on the current plan; user agents can be spoofed.',
              '- ChatGPT referral clicks are not claimed unless a separate supported referrer signal is available.',
          ]
          with open('cloudflare-analytics.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(text) + '\n')

          print('\n'.join(text))
          PY

      - name: Upload non-secret Cloudflare analytics evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-analytics
          path: |
            cloudflare-analytics.json
            cloudflare-analytics.txt
          retention-days: 30
