name: Cloudflare analytics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-analytics.yml'
      - 'scripts/fetch-cloudflare-analytics.py'
  schedule:
    - cron: '12 * * * *'

permissions:
  contents: read

jobs:
  cloudflare-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Cloudflare traffic and error-path analytics
        run: python scripts/fetch-cloudflare-analytics.py
      - name: Upload non-secret Cloudflare analytics evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-analytics
          path: |
            cloudflare-analytics.json
            cloudflare-analytics.txt
          retention-days: 30
