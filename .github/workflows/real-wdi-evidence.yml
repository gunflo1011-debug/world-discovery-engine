name: Build real WDI evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-real-wdi-evidence.py'
      - 'scripts/normalize-evidence-release-surface.mjs'
      - '.github/workflows/real-wdi-evidence.yml'

permissions:
  contents: write

jobs:
  build-real-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XLSX reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Build and normalize real archived WDI evidence
        run: |
          python scripts/build-real-wdi-evidence.py
          node scripts/normalize-evidence-release-surface.mjs
      - name: Verify generated evidence contract
        run: |
          python - <<'PY'
          import csv, json, re
          from pathlib import Path
          root=Path('site/evidence')
          manifest=json.load(open(root/'real-wdi-population-manifest.json',encoding='utf-8'))
          assert manifest['schemaVersion']=='1.4'
          assert manifest['count']==15 and len(manifest['items'])==15
          assert manifest['indicator']=={'code':'SP.POP.TOTL','name':'Population, total','referenceYear':2023,'unit':'people'}
          assert [a['vintage'] for a in manifest['archives']]==['2025-01-28','2025-07-02']
          for a in manifest['archives']:
              assert a['archivedIndicatorName']=='Population, total'
              assert re.fullmatch(r'[0-9a-f]{64}',a['archiveSha256']) and a['archiveBytes']>1_000_000
              assert a['archiveFile'].lower().endswith('.xlsx')
          expected={'DEU','USA','CHN','IND','JPN','GBR','FRA','ITA','BRA','CAN','AUS','ESP','MEX','IDN','KOR'}
          assert {i['code'] for i in manifest['items']}==expected
          for item in manifest['items']:
              page=root/item['slug']; d=json.load(open(page/'evidence.json',encoding='utf-8')); html=(page/'index.html').read_text(encoding='utf-8')
              assert d['schemaVersion']=='1.4' and d['status']=='REAL'
              assert d['entity']['code']==item['code'] and d['entity']['entityType']=='country'
              assert d['entity']['name']==item['country']==item['archivedCountryName']
              assert d['entity']['archivedNameVerifiedAcrossVintages'] is True and item['archivedNameVerifiedAcrossVintages'] is True
              assert d['indicator']['code']=='SP.POP.TOTL' and d['indicator']['name']=='Population, total' and d['referenceYear']==2023
              expected_type='NO_REVISION' if d['revision']['absolute']==0 else ('UPWARD_REVISION' if d['revision']['absolute']>0 else 'DOWNWARD_REVISION')
              assert d['finding']=={'type':expected_type,'isRevision':d['revision']['absolute']!=0}
              assert item['finding']==d['finding']
              assert f'Finding type: {expected_type}' in html
              assert f'Archived country identity verified in both releases: {d["entity"]["name"]} ({d["entity"]["code"]})' in html
              assert 'World Discovery Engine' not in html and 'World Discovery Data' not in html
              assert 'https://gunflo1011-debug.github.io/world-discovery-engine' not in html
              for key,a in zip(('first','latest'),manifest['archives']):
                  x=d[key]
                  assert x['vintage']==a['vintage'] and x['sourceUrl']==a['url']
                  assert x['archiveFile']==a['archiveFile'] and x['archiveSha256']==a['archiveSha256'] and x['archiveBytes']==a['archiveBytes']
                  assert x['archivedIndicatorName']==a['archivedIndicatorName']=='Population, total'
                  assert x['archivedCountryName']==d['entity']['name']==item['archivedCountryName']
              canonical=f"https://worlddiscoverydata.com/evidence/{item['slug']}/"
              assert f'<link rel="canonical" href="{canonical}">' in html
              assert './evidence.json' in html and './evidence.csv' in html
              if expected_type=='NO_REVISION':
                  assert 'was identical in both archived releases' in html and 'no revision was observed' in html
                  assert '+0 people' not in html and '+0.0000%' not in html
              else:
                  assert f'{d["revision"]["absolute"]:+,.0f} people' in html
                  assert f'{d["revision"]["relative"]*100:+.4f}%' in html
              m=re.search(r'<script type="application/ld\+json">(.*?)</script>',html); assert m
              ld=json.loads(m.group(1)); assert ld['@type']=='Dataset' and ld['url']==canonical
              assert ld['isBasedOn']==[d['first']['sourceUrl'],d['latest']['sourceUrl']]
              with open(page/'evidence.csv',newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
              assert len(rows)==2
              for row,key in zip(rows,('first','latest')):
                  assert row['entity_code']==d['entity']['code'] and row['entity']==d['entity']['name']
                  assert row['archived_country_name']==d[key]['archivedCountryName']==d['entity']['name']
                  assert row['indicator_code']==d['indicator']['code']
                  assert row['archived_indicator_name']=='Population, total' and float(row['value'])==d[key]['value']
                  assert row['archive_sha256']==d[key]['archiveSha256']
          counts={t:sum(i['finding']['type']==t for i in manifest['items']) for t in ('UPWARD_REVISION','DOWNWARD_REVISION','NO_REVISION')}
          assert sum(counts.values())==15
          print('Verified REAL population finding classifications and archived country identity:',counts)
          PY
      - name: Commit generated real evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/evidence
          if git diff --cached --quiet; then
            echo 'No evidence changes to commit.'
          else
            git commit -m 'Publish validated multi-country WDI population evidence'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              sleep $((attempt * 2))
            done
            echo 'Evidence publish failed after three fast-forward retries.' >&2
            exit 1
          fi
