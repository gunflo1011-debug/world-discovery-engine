name: Build real WDI evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-real-wdi-evidence.py'
      - '.github/workflows/real-wdi-evidence.yml'

permissions:
  contents: write

jobs:
  build-real-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XLSX reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Build real archived WDI evidence
        run: python scripts/build-real-wdi-evidence.py
      - name: Verify generated evidence
        run: |
          test -f site/evidence/real-wdi-population-revision-2025/index.html
          test -f site/evidence/real-wdi-population-revision-2025/evidence.json
          python - <<'PY'
          import json
          p='site/evidence/real-wdi-population-revision-2025/evidence.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['status']=='REAL'
          assert d['first']['vintage']=='2025-01-28'
          assert d['latest']['vintage']=='2025-07-02'
          print(json.dumps(d, indent=2))
          PY
      - name: Commit generated real evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/evidence/real-wdi-population-revision-2025
          if git diff --cached --quiet; then
            echo 'No evidence changes to commit.'
          else
            git commit -m 'Publish first real archived WDI evidence'
            git push
          fi
