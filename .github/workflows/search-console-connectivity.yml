name: Search Console connectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/search-console-connectivity.yml'
      - 'scripts/extract-search-console.mjs'
      - 'scripts/analyze-search-console.mjs'
      - 'test/search-console-extractor.test.js'

permissions:
  contents: read

jobs:
  verify-search-console:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install auth dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests
      - name: Verify access and fetch aggregate performance
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          raw=os.environ.get('GOOGLE_SEARCH_CONSOLE_CREDENTIALS','')
          if not raw: raise SystemExit('Missing GOOGLE_SEARCH_CONSOLE_CREDENTIALS secret')
          info=json.loads(raw)
          credentials=service_account.Credentials.from_service_account_info(info,scopes=['https://www.googleapis.com/auth/webmasters.readonly'])
          credentials.refresh(Request())
          headers={'Authorization':f'Bearer {credentials.token}','Content-Type':'application/json'}
          target='sc-domain:worlddiscoverydata.com'
          sites=requests.get('https://www.googleapis.com/webmasters/v3/sites',headers=headers,timeout=30)
          sites.raise_for_status()
          match=next((s for s in sites.json().get('siteEntry',[]) if s.get('siteUrl')==target),None)
          if not match: raise SystemExit('Connected, but target property not visible')
          end=datetime.date.today()-datetime.timedelta(days=2)
          start=end-datetime.timedelta(days=27)
          body={'startDate':str(start),'endDate':str(end),'dimensions':['date','page','query'],'rowLimit':25000,'dataState':'final'}
          url='https://www.googleapis.com/webmasters/v3/sites/'+requests.utils.quote(target,safe='')+'/searchAnalytics/query'
          response=requests.post(url,headers=headers,json=body,timeout=60)
          response.raise_for_status()
          with open('search-console-response.json','w',encoding='utf-8') as f: json.dump(response.json(),f)
          print('Search Console connection OK')
          print('Property:',target)
          print('Window:',start,'to',end)
          PY
      - name: Normalize, test and analyze
        run: |
          node --test test/search-console-extractor.test.js
          node scripts/extract-search-console.mjs search-console-response.json search-console.csv
          npm run analyze:search-console -- search-console.csv | tee search-console-opportunities.txt
          rm search-console-response.json
      - name: Upload non-secret aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: search-console-performance
          path: |
            search-console.csv
            search-console-opportunities.txt
          retention-days: 14
