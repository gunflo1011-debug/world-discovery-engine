name: Search Console connectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/search-console-connectivity.yml'
      - 'scripts/extract-search-console.mjs'
      - 'scripts/analyze-search-console.mjs'
      - 'test/search-console-extractor.test.js'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  verify-search-console:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOOGLE_SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install auth dependencies
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests
      - name: Fetch Search Console baseline and fresh 24-hour view
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          raw=os.environ.get('GOOGLE_SEARCH_CONSOLE_CREDENTIALS','')
          if not raw: raise SystemExit('Missing GOOGLE_SEARCH_CONSOLE_CREDENTIALS secret')
          info=json.loads(raw)
          credentials=service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/webmasters.readonly'],
          )
          credentials.refresh(Request())
          headers={'Authorization':f'Bearer {credentials.token}','Content-Type':'application/json'}
          target='sc-domain:worlddiscoverydata.com'
          encoded=requests.utils.quote(target,safe='')

          sites=requests.get('https://www.googleapis.com/webmasters/v3/sites',headers=headers,timeout=30)
          sites.raise_for_status()
          match=next((s for s in sites.json().get('siteEntry',[]) if s.get('siteUrl')==target),None)
          if not match: raise SystemExit('Connected, but target property not visible')

          sitemap_status={'available':False,'entries':[],'error':None}
          try:
              sitemap_response=requests.get(
                  'https://www.googleapis.com/webmasters/v3/sites/'+encoded+'/sitemaps',
                  headers=headers,
                  timeout=30,
              )
              sitemap_response.raise_for_status()
              entries=[]
              for item in sitemap_response.json().get('sitemap',[]):
                  contents=[]
                  for content in item.get('contents',[]) or []:
                      contents.append({
                          'type':content.get('type'),
                          'submitted':content.get('submitted'),
                          'indexed':content.get('indexed'),
                      })
                  entries.append({
                      'path':item.get('path'),
                      'lastSubmitted':item.get('lastSubmitted'),
                      'lastDownloaded':item.get('lastDownloaded'),
                      'isPending':item.get('isPending'),
                      'isSitemapsIndex':item.get('isSitemapsIndex'),
                      'type':item.get('type'),
                      'warnings':item.get('warnings'),
                      'errors':item.get('errors'),
                      'contents':contents,
                  })
              sitemap_status={'available':True,'entries':entries,'error':None}
          except requests.HTTPError as exc:
              sitemap_status={'available':False,'entries':[],'error':str(exc)}

          endpoint='https://www.googleapis.com/webmasters/v3/sites/'+encoded+'/searchAnalytics/query'

          def query(start_date, end_date, dimensions=None, limit=25000, data_state='final'):
              body={
                  'startDate':str(start_date),
                  'endDate':str(end_date),
                  'rowLimit':limit,
                  'dataState':data_state,
              }
              if dimensions: body['dimensions']=dimensions
              r=requests.post(endpoint,headers=headers,json=body,timeout=60)
              r.raise_for_status()
              return r.json()

          final_end=datetime.date.today()-datetime.timedelta(days=2)
          final_start=final_end-datetime.timedelta(days=27)
          aggregate=query(final_start,final_end,[],1,'final').get('rows',[])
          agg=aggregate[0] if aggregate else {}
          clicks=float(agg.get('clicks',0))
          impressions=float(agg.get('impressions',0))
          ctr=float(agg.get('ctr',0))
          position=float(agg.get('position',0)) if agg else 0

          dimensions={}
          for dim in ['date','query','page','country','device','searchAppearance']:
              try:
                  dimensions[dim]=query(final_start,final_end,[dim],25000,'final').get('rows',[])
              except requests.HTTPError as exc:
                  dimensions[dim]={'unavailable':str(exc)}

          detailed=query(final_start,final_end,['date','page','query'],25000,'final').get('rows',[])
          with open('search-console-response.json','w',encoding='utf-8') as f:
              json.dump({'rows':detailed},f)

          def clean_rows(rows, n=10):
              if not isinstance(rows,list): return rows
              return rows[:n]

          now=datetime.datetime.now(datetime.timezone.utc)
          fresh_end=now.date()
          fresh_start=fresh_end-datetime.timedelta(days=2)
          fresh_error=None
          fresh_hourly=[]
          fresh_metadata={}
          try:
              hourly_payload=query(fresh_start,fresh_end,['date','hour'],25000,'hourly_all')
              fresh_hourly=hourly_payload.get('rows',[])
              fresh_metadata=hourly_payload.get('metadata',{}) or {}
          except requests.HTTPError as exc:
              fresh_error=str(exc)

          rolling=(fresh_hourly[-24:] if isinstance(fresh_hourly,list) else [])
          if fresh_error is None:
              fresh_clicks=sum(float(r.get('clicks',0)) for r in rolling)
              fresh_impressions=sum(float(r.get('impressions',0)) for r in rolling)
              fresh_ctr=(fresh_clicks/fresh_impressions) if fresh_impressions else 0
              fresh_position=(
                  sum(float(r.get('position',0))*float(r.get('impressions',0)) for r in rolling)/fresh_impressions
                  if fresh_impressions else 0
              )
          else:
              fresh_clicks=None
              fresh_impressions=None
              fresh_ctr=None
              fresh_position=None

          calendar_error=None
          calendar_agg={}
          try:
              calendar_rows=query(fresh_start,fresh_end,[],1,'all').get('rows',[])
              calendar_agg=calendar_rows[0] if calendar_rows else {}
          except requests.HTTPError as exc:
              calendar_error=str(exc)

          calendar_clicks=(float(calendar_agg.get('clicks',0)) if calendar_error is None else None)
          calendar_impressions=(float(calendar_agg.get('impressions',0)) if calendar_error is None else None)
          calendar_ctr=(float(calendar_agg.get('ctr',0)) if calendar_error is None else None)
          calendar_position=(float(calendar_agg.get('position',0)) if calendar_agg and calendar_error is None else (0 if calendar_error is None else None))

          fresh_dimensions={}
          for dim in ['query','page','country','device','searchAppearance']:
              try:
                  fresh_dimensions[dim]=query(fresh_start,fresh_end,[dim],25000,'all').get('rows',[])
              except requests.HTTPError as exc:
                  fresh_dimensions[dim]={'unavailable':str(exc)}

          summary={
              'property':target,
              'propertyPermissionLevel':match.get('permissionLevel'),
              'sitemaps':sitemap_status,
              'startDate':str(final_start),
              'endDate':str(final_end),
              'clicks':clicks,
              'impressions':impressions,
              'ctr':ctr,
              'averagePosition':position,
              'rowCounts':{k:(len(v) if isinstance(v,list) else None) for k,v in dimensions.items()},
              'topQueries':clean_rows(dimensions['query']),
              'topPages':clean_rows(dimensions['page']),
              'countries':clean_rows(dimensions['country']),
              'devices':clean_rows(dimensions['device']),
              'searchAppearance':clean_rows(dimensions['searchAppearance']),
              'daily':clean_rows(dimensions['date'],40),
              'fresh24h':{
                  'generatedAtUtc':now.isoformat(),
                  'available':fresh_error is None,
                  'dataState':'hourly_all',
                  'hourlyApiError':fresh_error,
                  'metadata':fresh_metadata,
                  'returnedHourlyRows':len(fresh_hourly) if isinstance(fresh_hourly,list) else 0,
                  'rolling24hRows':len(rolling),
                  'clicks':fresh_clicks,
                  'impressions':fresh_impressions,
                  'ctr':fresh_ctr,
                  'averagePosition':fresh_position,
                  'hourly':rolling,
                  'calendarWindowStart':str(fresh_start),
                  'calendarWindowEnd':str(fresh_end),
                  'calendarWindow':{
                      'available':calendar_error is None,
                      'dataState':'all',
                      'error':calendar_error,
                      'clicks':calendar_clicks,
                      'impressions':calendar_impressions,
                      'ctr':calendar_ctr,
                      'averagePosition':calendar_position,
                  },
                  'topQueriesCalendarWindow':clean_rows(fresh_dimensions['query']),
                  'topPagesCalendarWindow':clean_rows(fresh_dimensions['page']),
                  'countriesCalendarWindow':clean_rows(fresh_dimensions['country']),
                  'devicesCalendarWindow':clean_rows(fresh_dimensions['device']),
                  'searchAppearanceCalendarWindow':clean_rows(fresh_dimensions['searchAppearance']),
              },
          }
          with open('search-console-baseline.json','w',encoding='utf-8') as f:
              json.dump(summary,f,indent=2)

          print('SEARCH_CONSOLE_BASELINE_BEGIN')
          print(json.dumps(summary,indent=2))
          print('SEARCH_CONSOLE_BASELINE_END')
          PY
      - name: Normalize, test and analyze
        run: |
          node --test test/search-console-extractor.test.js
          node scripts/extract-search-console.mjs search-console-response.json search-console.csv
          npm run analyze:search-console -- search-console.csv | tee search-console-opportunities.txt
          rm search-console-response.json
      - name: Upload non-secret aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: search-console-performance
          path: |
            search-console-baseline.json
            search-console.csv
            search-console-opportunities.txt
          retention-days: 30
